header: string.h
component: llvm-libc

functions:
  memcpy:
    signature: "void *(void *dest, const void *src, size_t count)"
    status: experimental
    preconditions:
      - "dest and src are valid memory regions of at least count bytes."
      - "src and dest ranges do not overlap."
    behaviors:
      - id: "string.memcpy.B1"
        text: "Returns dest."
      - id: "string.memcpy.B2"
        text: "If count > 0, writes exactly count bytes to dest."
      - id: "string.memcpy.B3"
        text: "For all i in [0, count), the byte at ((unsigned char *)dest)[i] after the call equals the byte at ((const unsigned char *)src)[i] before the call."
      - id: "string.memcpy.B4"
        text: "If count == 0, performs no reads from src and no writes to dest."
      - id: "string.memcpy.B5"
        text: "Does not write outside dest..dest+count."
      - id: "string.memcpy.B6"
        text: "When LIBC_ADD_NULL_CHECKS is enabled, memcpy(nullptr, nullptr, 1) terminates via the configured null-pointer checks."

  memset:
    signature: "void *(void *dest, int value, size_t count)"
    status: experimental
    preconditions:
      - "dest is a valid memory region of at least count bytes."
    behaviors:
      - id: "string.memset.B1"
        text: "Returns dest."
      - id: "string.memset.B2"
        text: "If count > 0, writes exactly count bytes to dest."
      - id: "string.memset.B3"
        text: "For all i in [0, count), the byte at ((unsigned char *)dest)[i] after the call equals (unsigned char)value."
      - id: "string.memset.B4"
        text: "If count == 0, performs no writes to dest."
      - id: "string.memset.B5"
        text: "Does not write outside dest..dest+count."
      - id: "string.memset.B6"
        text: "When LIBC_ADD_NULL_CHECKS is enabled, memset(nullptr, 0, 1) terminates via the configured null-pointer checks."

  memcmp:
    signature: "int(const void *lhs, const void *rhs, size_t count)"
    status: experimental
    preconditions:
      - "lhs and rhs are valid memory regions of at least count bytes."
    behaviors:
      - id: "string.memcmp.B1"
        text: "If count == 0, returns 0."
      - id: "string.memcmp.B2"
        text: "Returns 0 when the first count bytes of lhs and rhs compare equal."
      - id: "string.memcmp.B3"
        text: "Returns a value less than 0 when the first differing byte in lhs is less than the corresponding byte in rhs."
      - id: "string.memcmp.B4"
        text: "Returns a value greater than 0 when the first differing byte in lhs is greater than the corresponding byte in rhs."
      - id: "string.memcmp.B5"
        text: "When LIBC_ADD_NULL_CHECKS is enabled, memcmp(nullptr, nullptr, 1) terminates via the configured null-pointer checks."

  memchr:
    signature: "void *(const void *src, int value, size_t count)"
    status: experimental
    preconditions:
      - "src is a valid memory region of at least count bytes."
    behaviors:
      - id: "string.memchr.B1"
        text: "Returns a pointer to the first byte equal to (unsigned char)value within the first count bytes of src."
      - id: "string.memchr.B2"
        text: "Returns nullptr when no byte equal to (unsigned char)value appears within the first count bytes of src."
      - id: "string.memchr.B3"
        text: "Searches the full count-byte range and does not stop at a null byte."
      - id: "string.memchr.B4"
        text: "When LIBC_ADD_NULL_CHECKS is enabled, memchr(nullptr, 1, 1) terminates via the configured null-pointer checks."

  strlen:
    signature: "size_t(const char *src)"
    status: experimental
    preconditions:
      - "src points to a null-terminated byte string."
    behaviors:
      - id: "string.strlen.B1"
        text: "Returns 0 for an empty string."
      - id: "string.strlen.B2"
        text: "Returns the number of bytes before the first null terminator."
      - id: "string.strlen.B3"
        text: "Stops at the first null terminator even if later bytes are non-zero."
      - id: "string.strlen.B4"
        text: "When LIBC_ADD_NULL_CHECKS is enabled, strlen(nullptr) terminates via the configured null-pointer checks."

  memrchr:
    signature: "void *(const void *src, int value, size_t count)"
    status: experimental
    preconditions:
      - "src is a valid memory region of at least count bytes."
    behaviors:
      - id: "string.memrchr.B1"
        text: "Returns a pointer to the last byte equal to (unsigned char)value within the first count bytes of src."
      - id: "string.memrchr.B2"
        text: "Returns nullptr when no byte equal to (unsigned char)value appears within the first count bytes of src."
      - id: "string.memrchr.B3"
        text: "Searches the full count-byte range and does not stop at a null byte."
      - id: "string.memrchr.B4"
        text: "If count == 0, returns nullptr."
      - id: "string.memrchr.B5"
        text: "When LIBC_ADD_NULL_CHECKS is enabled, memrchr(nullptr, 'd', 1) terminates via the configured null-pointer checks."

  strcmp:
    signature: "int(const char *lhs, const char *rhs)"
    status: experimental
    preconditions:
      - "lhs and rhs point to null-terminated byte strings."
    behaviors:
      - id: "string.strcmp.B1"
        text: "Returns 0 when lhs and rhs compare equal."
      - id: "string.strcmp.B2"
        text: "Returns a value less than 0 when the first differing byte in lhs is less than the corresponding byte in rhs, treating bytes as unsigned char."
      - id: "string.strcmp.B3"
        text: "Returns a value greater than 0 when the first differing byte in lhs is greater than the corresponding byte in rhs, treating bytes as unsigned char."
      - id: "string.strcmp.B4"
        text: "Stops comparison at the first null terminator."

  strncmp:
    signature: "int(const char *lhs, const char *rhs, size_t count)"
    status: experimental
    preconditions:
      - "lhs and rhs point to byte strings that are readable up to the first null terminator or count bytes, whichever comes first."
    behaviors:
      - id: "string.strncmp.B1"
        text: "If count == 0, returns 0."
      - id: "string.strncmp.B2"
        text: "Returns 0 when lhs and rhs compare equal over the first count bytes or until an earlier null terminator."
      - id: "string.strncmp.B3"
        text: "Returns a value less than 0 when the first differing byte in lhs is less than the corresponding byte in rhs within the compared range, treating bytes as unsigned char."
      - id: "string.strncmp.B4"
        text: "Returns a value greater than 0 when the first differing byte in lhs is greater than the corresponding byte in rhs within the compared range, treating bytes as unsigned char."
      - id: "string.strncmp.B5"
        text: "Stops comparison at the first null terminator even if count is larger."
      - id: "string.strncmp.B6"
        text: "When LIBC_ADD_NULL_CHECKS is enabled, strncmp(nullptr, nullptr, 1) terminates via the configured null-pointer checks."

  strnlen:
    signature: "size_t(const char *src, size_t count)"
    status: experimental
    preconditions:
      - "src points to a byte string that is readable for at least count bytes or until an earlier null terminator."
    behaviors:
      - id: "string.strnlen.B1"
        text: "Returns 0 for an empty string."
      - id: "string.strnlen.B2"
        text: "Returns the number of bytes before the first null terminator when that terminator appears within the first count bytes."
      - id: "string.strnlen.B3"
        text: "Returns count when no null terminator appears within the first count bytes."

  strchr:
    signature: "char *(const char *src, int value)"
    status: experimental
    preconditions:
      - "src points to a null-terminated byte string."
    behaviors:
      - id: "string.strchr.B1"
        text: "Returns a pointer to the first occurrence of (char)value in src."
      - id: "string.strchr.B2"
        text: "Returns a pointer to the terminating null byte when value is '\\0'."
      - id: "string.strchr.B3"
        text: "Returns nullptr when (char)value does not occur in src before the terminating null byte."
